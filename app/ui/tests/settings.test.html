<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>settings tests</title>
<style>
  body { font: 14px/1.4 monospace; margin: 12px; }
  .pass { color: #0a7d2c; }
  .fail { color: #c00; font-weight: bold; }
  #result { font-size: 20px; font-weight: bold; margin: 12px 0; }
  #stage { position: absolute; left: -10000px; top: 0; }
</style>
</head>
<body>
<h3>Settings tests (app/ui/prefs.js, and the Settings screen of start.js inside ../index.html)</h3>
<div id="result">RUNNING</div>
<ul id="log"></ul>
<div id="stage"></div>
<script src="fakes.js"></script>
<script>
(function () {
  "use strict";
  const F = window.GLFakes;
  const sleep = F.sleep;
  const log = document.getElementById("log");
  const stage = document.getElementById("stage");
  const KEY = "gl.prefs";
  const LAST = "gl.update.lastCheck";
  let failures = 0, total = 0;

  function ok(c, m) { if (!c) throw new Error(m || "assertion failed"); }
  function eq(a, b, m) { if (a !== b) throw new Error((m || "values differ") + ": got " + JSON.stringify(a) + ", want " + JSON.stringify(b)); }

  async function test(name, fn) {
    total++;
    const li = document.createElement("li");
    try {
      await fn();
      li.className = "pass";
      li.textContent = "PASS " + name;
    } catch (e) {
      failures++;
      li.className = "fail";
      li.textContent = "FAIL " + name + " -- " + (e && e.message ? e.message : e);
    }
    log.appendChild(li);
  }

  // The real storage of this page (shared with the iframes below: same origin).
  function store(raw) {
    try {
      if (raw === null) localStorage.removeItem(KEY);
      else localStorage.setItem(KEY, raw);
    } catch (_) { throw new Error("localStorage is not usable in the test page"); }
  }
  const stored = () => localStorage.getItem(KEY);

  // A fresh window with a freshly loaded prefs.js: what the app sees after a reload.
  async function freshPrefs(setup) {
    const iframe = document.createElement("iframe");
    stage.appendChild(iframe);
    const w = iframe.contentWindow;
    if (setup) setup(w);
    await new Promise((resolve, reject) => {
      const s = w.document.createElement("script");
      s.src = new URL("../prefs.js", location.href).href;
      s.onload = resolve;
      s.onerror = () => reject(new Error("prefs.js did not load"));
      w.document.head.appendChild(s);
    });
    if (!w.GLPrefs) throw new Error("GLPrefs missing");
    return { win: w, prefs: w.GLPrefs, done: () => iframe.remove() };
  }
  async function withPrefs(raw, fn, setup) {
    store(raw);
    const f = await freshPrefs(setup);
    try { await fn(f.prefs, f); } finally { f.done(); store(null); }
  }
  function throwingStorage(w) {
    Object.defineProperty(w, "localStorage", { configurable: true, get: function () { throw new Error("storage blocked"); } });
  }

  // The start page with fakes; o: make() options + width/height. prefRaw seeds gl.prefs first.
  // o.lastCheck seeds "gl.update.lastCheck" (default: just now, so there is no automatic update check; null = missing).
  async function page(o, prefRaw) {
    store(prefRaw === undefined ? null : prefRaw);
    try {
      const lc = !o || o.lastCheck === undefined ? Date.now() : o.lastCheck;
      if (lc === null) localStorage.removeItem(LAST); else localStorage.setItem(LAST, String(lc));
    } catch (_) { throw new Error("localStorage is not usable in the test page"); }
    o = Object.assign({ host: stage, width: 360, height: 740, recents: [] }, o || {});
    const p = await F.load(o);
    p.$ = (id) => p.doc.getElementById(id);
    p.q = (s) => p.doc.querySelector(s);
    p.qa = (s) => Array.from(p.doc.querySelectorAll(s));
    p.rect = (el) => el.getBoundingClientRect();
    p.visible = (el) => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
    p.click = async (el) => { el.click(); await sleep(40); };
    p.openSettings = async () => {
      await p.click(p.$("menu_btn"));
      const item = p.qa("#menu button").find((b) => b.textContent === "Settings");
      ok(item, "Settings item in the menu");
      await p.click(item);
    };
    p.back = async () => { p.win.dispatchEvent(new p.win.PopStateEvent("popstate", { state: null })); await sleep(20); };
    const on = (i) => p.qa("#settings .seg")[i].querySelectorAll("[role=radio]");
    p.checked = () => Array.from(on(0)).filter((b) => b.getAttribute("aria-checked") === "true").map((b) => b.textContent);        // Page direction
    p.checkedUpd = () => Array.from(on(1)).filter((b) => b.getAttribute("aria-checked") === "true").map((b) => b.textContent);     // Updates
    p.status = () => p.$("upd_status");
    p.cmds = (c) => p.fake.calls.invoke.filter((x) => x.cmd === c);
    p.done = () => p.iframe.remove();
    return p;
  }
  async function withPage(o, raw, fn) {
    const p = await page(o, raw);
    try { await fn(p); } finally { p.done(); store(null); try { localStorage.removeItem(LAST); } catch (_) { /* ignore */ } }
  }

  async function run() {
    // ---------------------------------------------------------------- GLPrefs
    await test("nothing stored: pageDirection is vertical and updateCheck is on, all() has the defaults", () => withPrefs(null, async (g) => {
      eq(g.get("pageDirection"), "vertical");
      eq(g.get("updateCheck"), "on");
      eq(JSON.stringify(g.all()), JSON.stringify({ pageDirection: "vertical", updateCheck: "on" }));
    }));

    await test("set sideways, then a fresh read (reload) gives sideways", () => withPrefs(null, async (g) => {
      eq(g.set("pageDirection", "sideways"), true);
      eq(g.get("pageDirection"), "sideways");
      eq(JSON.parse(stored()).pageDirection, "sideways", "stored as JSON under gl.prefs");
      const again = await freshPrefs();
      try { eq(again.prefs.get("pageDirection"), "sideways", "after reload"); } finally { again.done(); }
      g.set("pageDirection", "vertical");
      eq(g.get("pageDirection"), "vertical");
    }));

    await test("corrupt JSON in gl.prefs gives vertical (and the next set repairs it)", () => withPrefs("{not json", async (g) => {
      eq(g.get("pageDirection"), "vertical");
      g.set("pageDirection", "sideways");
      eq(JSON.parse(stored()).pageDirection, "sideways");
    }));

    await test("stored values of the wrong shape give vertical", async () => {
      for (const raw of ["null", "42", "\"sideways\"", "[]", "{}", "{\"pageDirection\":7}", "{\"pageDirection\":null}", "{\"pageDirection\":\"Sideways\"}"]) {
        await withPrefs(raw, async (g) => { eq(g.get("pageDirection"), "vertical", raw); });
      }
    });

    await test("unknown value (diagonal) in storage gives vertical; set() ignores it and unknown names", () => withPrefs("{\"pageDirection\":\"diagonal\"}", async (g) => {
      eq(g.get("pageDirection"), "vertical");
      eq(g.set("pageDirection", "diagonal"), false);
      eq(g.get("pageDirection"), "vertical");
      g.set("pageDirection", "sideways");
      eq(g.set("pageDirection", "diagonal"), false);
      eq(g.get("pageDirection"), "sideways", "a rejected value leaves the saved one alone");
      eq(g.set("colour", "red"), false);
      eq(g.get("colour"), undefined);
      eq(JSON.stringify(g.all()), JSON.stringify({ pageDirection: "sideways", updateCheck: "on" }), "no unknown keys");
    }));

    await test("unknown keys in storage are not returned by all()", () => withPrefs("{\"pageDirection\":\"sideways\",\"other\":1}", async (g) => {
      eq(JSON.stringify(g.all()), JSON.stringify({ pageDirection: "sideways", updateCheck: "on" }));
    }));

    await test("updateCheck: off is saved and survives a reload; on puts it back; other values are ignored", () => withPrefs(null, async (g) => {
      eq(g.set("updateCheck", "off"), true);
      eq(g.get("updateCheck"), "off");
      eq(JSON.parse(stored()).updateCheck, "off", "stored as JSON under gl.prefs");
      eq(g.get("pageDirection"), "vertical", "the other pref is untouched");
      const again = await freshPrefs();
      try { eq(again.prefs.get("updateCheck"), "off", "after reload"); } finally { again.done(); }
      eq(g.set("updateCheck", "maybe"), false);
      eq(g.set("updateCheck", true), false);
      eq(g.get("updateCheck"), "off", "a rejected value leaves the saved one alone");
      g.set("updateCheck", "on");
      eq(g.get("updateCheck"), "on");
    }));

    await test("updateCheck: corrupt or wrong-shaped stored values give on", async () => {
      for (const raw of ["{not json", "null", "[]", "{}", "{\"updateCheck\":7}", "{\"updateCheck\":null}", "{\"updateCheck\":\"Off\"}", "{\"updateCheck\":\"never\"}"]) {
        await withPrefs(raw, async (g) => { eq(g.get("updateCheck"), "on", raw); });
      }
    });

    await test("updateCheck: works in memory when storage throws", () => withPrefs(null, async (g) => {
      eq(g.get("updateCheck"), "on");
      eq(g.set("updateCheck", "off"), true);
      eq(g.get("updateCheck"), "off");
    }, throwingStorage));

    await test("storage that throws on every access: still works in memory", () => withPrefs(null, async (g, f) => {
      let threw = false;
      try { void f.win.localStorage; } catch (_) { threw = true; }
      ok(threw, "the fake storage really throws");
      eq(g.get("pageDirection"), "vertical");
      eq(g.set("pageDirection", "sideways"), true);
      eq(g.get("pageDirection"), "sideways", "kept in memory");
      eq(g.all().pageDirection, "sideways");
      eq(g.set("pageDirection", "diagonal"), false);
      eq(g.get("pageDirection"), "sideways");
    }, throwingStorage));

    await test("storage that reads but refuses writes: the choice still sticks for this run", () => withPrefs(null, async (g, f) => {
      f.win.Storage.prototype.setItem = function () { throw new Error("quota"); };
      g.set("pageDirection", "sideways");
      eq(g.get("pageDirection"), "sideways");
      eq(stored(), null, "nothing was written");
    }));

    // ---------------------------------------------------------------- Settings screen
    await test("menu lists Settings above About; Settings opens a sheet titled Settings", () => withPage({}, null, async (p) => {
      ok(!p.visible(p.$("settings")), "closed first");
      await p.click(p.$("menu_btn"));
      eq(p.qa("#menu button").map((b) => b.textContent).join("|"), "Settings|About");
      await p.click(p.qa("#menu button")[0]);
      ok(p.visible(p.$("settings")), "sheet open");
      ok(!p.visible(p.$("about")), "About stays closed");
      eq(p.q("#settings .bar h1").textContent, "Settings");
      eq(p.win.getComputedStyle(p.q("#settings .bar")).backgroundColor, "rgb(27, 94, 32)");
      const c = p.rect(p.$("settings_close"));
      ok(c.width >= 48 && c.height >= 48, "close button " + c.width + "x" + c.height);
    }));

    await test("two rows only: Page direction (Vertical | Sideways) and Updates (On | Off, Check now)", () => withPage({}, null, async (p) => {
      await p.openSettings();
      const rows = p.qa("#settings .setting");
      eq(rows.length, 2, "two setting rows");
      eq(rows[0].querySelector("h2").textContent, "Page direction");
      eq(rows[0].querySelector("p").textContent, "How you swipe between pages.");
      eq(Array.from(rows[0].querySelectorAll(".seg button")).map((b) => b.textContent).join("|"), "Vertical|Sideways");
      eq(rows[1].querySelector("h2").textContent, "Updates");
      eq(rows[1].querySelector("p").textContent, "Once a day, Greenline asks GitHub whether a newer version is out. Nothing else is sent.");
      eq(Array.from(rows[1].querySelectorAll(".seg button")).map((b) => b.textContent).join("|"), "On|Off");
      eq(p.$("upd_check").textContent, "Check now");
      eq(Array.from(p.qa("#settings button")).filter((b) => p.visible(b)).length, 6, "close + two + two choices + Check now, nothing else");
      ok(!p.visible(p.$("upd_set_go")), "no Update button before a check");
      ok(!p.visible(p.$("upd_status")), "no status line before a check");
    }));

    await test("at 360 px both choices are at least 48 px tall and nothing overflows", () => withPage({ width: 360 }, null, async (p) => {
      await p.openSettings();
      const bs = p.qa("#settings .seg button");
      eq(bs.length, 4);
      bs.push(p.$("upd_check"));
      for (const b of bs) {
        const r = p.rect(b);
        ok(r.height >= 48, b.textContent + " is " + r.height + " px tall");
        ok(r.width >= 48, b.textContent + " is " + r.width + " px wide");
      }
      const de = p.doc.documentElement;
      ok(de.scrollWidth <= de.clientWidth, "scrollWidth " + de.scrollWidth);
      for (const el of p.qa("#settings, #settings *")) {
        const r = p.rect(el);
        if (r.width === 0) continue;
        ok(r.left >= -0.5 && r.right <= 360.5, el.tagName + "#" + el.id + " spans " + r.left + ".." + r.right);
      }
    }));

    await test("nothing saved: Vertical is the selected choice", () => withPage({}, null, async (p) => {
      await p.openSettings();
      eq(p.checked().join("|"), "Vertical");
    }));

    await test("saved sideways: Sideways is the selected choice, and it looks selected", () => withPage({}, "{\"pageDirection\":\"sideways\"}", async (p) => {
      await p.openSettings();
      eq(p.checked().join("|"), "Sideways");
      const on = p.win.getComputedStyle(p.$("dir_sideways")), off = p.win.getComputedStyle(p.$("dir_vertical"));
      eq(on.backgroundColor, "rgb(46, 125, 50)");
      ok(off.backgroundColor !== on.backgroundColor, "the other choice looks different");
    }));

    await test("corrupt saved prefs: the screen shows Vertical", () => withPage({}, "{oops", async (p) => {
      await p.openSettings();
      eq(p.checked().join("|"), "Vertical");
    }));

    await test("tapping Sideways updates GLPrefs and storage; tapping Vertical puts it back", () => withPage({}, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("dir_sideways"));
      eq(p.win.GLPrefs.get("pageDirection"), "sideways");
      eq(JSON.parse(stored()).pageDirection, "sideways");
      eq(p.checked().join("|"), "Sideways");
      await p.click(p.$("dir_sideways"));
      eq(p.win.GLPrefs.get("pageDirection"), "sideways", "tapping the selected one changes nothing");
      await p.click(p.$("dir_vertical"));
      eq(p.win.GLPrefs.get("pageDirection"), "vertical");
      eq(p.checked().join("|"), "Vertical");
    }));

    await test("the choice is still shown when Settings is opened again", () => withPage({}, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("dir_sideways"));
      await p.click(p.$("settings_close"));
      await p.openSettings();
      eq(p.checked().join("|"), "Sideways");
    }));

    await test("Android Back (popstate) returns to the start screen", () => withPage({}, null, async (p) => {
      await p.openSettings();
      ok(p.visible(p.$("settings")), "open");
      await p.back();
      ok(!p.visible(p.$("settings")), "closed by Back");
      ok(p.visible(p.$("start")) && p.visible(p.$("open_pdf")), "start screen visible");
      await p.back();
      ok(p.visible(p.$("start")), "a second Back with nothing open does nothing here");
    }));

    await test("a popstate that lands on the sheet's own entry keeps Settings open", () => withPage({}, null, async (p) => {
      await p.openSettings();
      p.win.dispatchEvent(new p.win.PopStateEvent("popstate", { state: { glSheet: 1 } }));
      ok(p.visible(p.$("settings")), "still open");
    }));

    await test("the close button returns to the start screen and leaves the history clean", () => withPage({}, null, async (p) => {
      await p.openSettings();
      eq(p.fake.history.length, 2, "one entry pushed");
      await p.click(p.$("settings_close"));
      await sleep(20);
      ok(!p.visible(p.$("settings")), "closed");
      ok(p.visible(p.$("start")), "start visible");
      eq(p.fake.history.length, 1, "entry popped again");
    }));

    await test("About still opens and closes after Settings was used", () => withPage({}, null, async (p) => {
      await p.openSettings();
      await p.back();
      await p.click(p.$("menu_btn"));
      await p.click(p.qa("#menu button")[1]);
      ok(p.visible(p.$("about")) && !p.visible(p.$("settings")), "About open, Settings closed");
      await p.back();
      ok(!p.visible(p.$("about")), "About closed by Back");
    }));

    await test("sheet has an explicit background from the CSS token (so light and dark both work)", () => withPage({}, null, async (p) => {
      await p.openSettings();
      const bg = p.win.getComputedStyle(p.$("settings")).backgroundColor;
      const tok = p.win.getComputedStyle(p.doc.documentElement).getPropertyValue("--bg").trim();
      ok(tok.length > 0, "--bg token exists");
      ok(bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent", "explicit background " + bg);
    }));

    // ---------------------------------------------------------------- Updates row (task 2b.9)
    await test("Updates: nothing saved -> On is selected; saved off -> Off is selected; corrupt prefs -> On", async () => {
      await withPage({}, null, async (p) => { await p.openSettings(); eq(p.checkedUpd().join("|"), "On"); });
      await withPage({}, "{\"updateCheck\":\"off\"}", async (p) => {
        await p.openSettings();
        eq(p.checkedUpd().join("|"), "Off");
        eq(p.checked().join("|"), "Vertical", "Page direction unaffected");
        const a = p.win.getComputedStyle(p.$("upd_off")), b = p.win.getComputedStyle(p.$("upd_on"));
        eq(a.backgroundColor, "rgb(46, 125, 50)");
        ok(a.backgroundColor !== b.backgroundColor, "the other choice looks different");
      });
      await withPage({}, "{oops", async (p) => { await p.openSettings(); eq(p.checkedUpd().join("|"), "On"); });
    });

    await test("Updates: tapping Off saves it, tapping On puts it back; Page direction is not touched", () => withPage({}, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("upd_off"));
      eq(p.win.GLPrefs.get("updateCheck"), "off");
      eq(JSON.parse(stored()).updateCheck, "off");
      eq(p.checkedUpd().join("|"), "Off");
      eq(p.checked().join("|"), "Vertical");
      await p.click(p.$("dir_sideways"));
      eq(p.win.GLPrefs.get("updateCheck"), "off", "choosing a direction keeps the updates choice");
      await p.click(p.$("upd_on"));
      eq(p.win.GLPrefs.get("updateCheck"), "on");
      eq(p.checkedUpd().join("|"), "On");
      eq(p.win.GLPrefs.get("pageDirection"), "sideways");
    }));

    await test("Updates: the choice is shown again when Settings is reopened", () => withPage({}, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("upd_off"));
      await p.click(p.$("settings_close"));
      await p.openSettings();
      eq(p.checkedUpd().join("|"), "Off");
    }));

    await test("Check now: no update -> You have the latest version.", () => withPage({}, null, async (p) => {
      await p.openSettings();
      ok(!p.visible(p.status()), "no status first");
      await p.click(p.$("upd_check"));
      eq(p.cmds("update_check").length, 1);
      ok(p.visible(p.status()), "status shown");
      eq(p.status().textContent, "You have the latest version.");
      ok(p.rect(p.status()).top >= p.rect(p.$("upd_check")).bottom, "status sits under the button");
      ok(!p.visible(p.$("updcard")), "no card");
      ok(!p.$("upd_check").disabled, "button usable again");
    }));

    await test("Check now: update found -> Version X is available. and the start-screen card appears", () => withPage({ updateAvailable: true }, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("upd_check"));
      eq(p.status().textContent, "Version 0.1.9 is available.");
      await p.click(p.$("settings_close"));
      ok(p.visible(p.$("updcard")), "card on the start screen");
      eq(p.q("#updcard h3").textContent, "Update available");
      eq(p.$("upd_text").textContent, "Version 0.1.9 (13.1 MB)");
      eq(Array.from(p.qa("#updcard button")).map((b) => b.textContent).join("|"), "Later|Update");
    }));

    await test("Check now: update found -> an Update button in Settings closes Settings and starts the download", () => withPage({ updateAvailable: true }, null, async (p) => {
      await p.openSettings();
      ok(!p.visible(p.$("upd_set_go")), "no Update button before a check");
      await p.click(p.$("upd_check"));
      ok(p.visible(p.$("upd_set_go")), "Update button shown");
      eq(p.$("upd_set_go").textContent, "Update");
      const r = p.rect(p.$("upd_set_go"));
      ok(r.height >= 48, "button is " + r.height + " px tall");
      ok(r.top >= p.rect(p.status()).bottom, "button sits under the status line");
      await p.click(p.$("upd_set_go"));
      ok(!p.visible(p.$("settings")), "Settings closed");
      ok(p.visible(p.$("updcard")), "card on the start screen");
      eq(p.cmds("update_download").length, 1, "download started");
      await p.openSettings();
      ok(!p.visible(p.$("upd_set_go")), "button cleared when Settings opens again");
    }));

    await test("Check now: no Update button when there is no update or the check fails", async () => {
      for (const o of [{}, { updateCheckReject: "E_UPDATE_NETWORK" }]) {
        await withPage(o, null, async (p) => {
          await p.openSettings();
          await p.click(p.$("upd_check"));
          ok(!p.visible(p.$("upd_set_go")), "no Update button");
        });
      }
    });

    await test("Check now: failure -> Could not check (CODE). and nothing raw", async () => {
      for (const [rej, code] of [["E_UPDATE_NETWORK", "E_UPDATE_NETWORK"], ["E_UPDATE_UNSUPPORTED", "E_UPDATE_UNSUPPORTED"], [new Error("raw SENTINEL /storage/emulated/0/x.pdf"), "E_UPDATE_FAILED"], ["raw SENTINEL text", "E_UPDATE_FAILED"]]) {
        await withPage({ updateCheckReject: rej }, null, async (p) => {
          await p.openSettings();
          await p.click(p.$("upd_check"));
          eq(p.status().textContent, "Could not check (" + code + ").");
          ok(p.doc.body.textContent.indexOf("SENTINEL") < 0, "no raw text");
          ok(!p.visible(p.$("updcard")), "no card");
        });
      }
    });

    await test("Check now works with automatic checks off, and shows a new result each time", () => withPage({ updateAvailable: true }, "{\"updateCheck\":\"off\"}", async (p) => {
      eq(p.cmds("update_check").length, 0, "nothing automatic");
      await p.openSettings();
      await p.click(p.$("upd_check"));
      eq(p.cmds("update_check").length, 1);
      eq(p.status().textContent, "Version 0.1.9 is available.");
      eq(p.win.GLPrefs.get("updateCheck"), "off", "the pref is unchanged");
    }));

    await test("Check now: Later hides the card, and the next check brings it back", () => withPage({ updateAvailable: true }, null, async (p) => {
      await p.openSettings();
      await p.click(p.$("upd_check"));
      await p.click(p.$("settings_close"));
      await p.click(p.$("upd_later"));
      ok(!p.visible(p.$("updcard")), "hidden by Later");
      await p.openSettings();
      ok(!p.visible(p.status()), "the status line is cleared when Settings opens again");
      await p.click(p.$("upd_check"));
      await p.click(p.$("settings_close"));
      ok(p.visible(p.$("updcard")), "card back after the next check");
      eq(p.cmds("update_check").length, 2);
    }));

    await test("Check now at 360 px: button and status fit, button is at least 48 px, in every status", async () => {
      for (const o of [{}, { updateAvailable: true }, { updateCheckReject: "E_UPDATE_BAD_RELEASE" }]) {
        await withPage(Object.assign({ width: 360 }, o), null, async (p) => {
          await p.openSettings();
          await p.click(p.$("upd_check"));
          ok(p.visible(p.status()), "status shown");
          const r = p.rect(p.$("upd_check"));
          ok(r.height >= 48 && r.width >= 48, "Check now is " + r.width + "x" + r.height);
          const de = p.doc.documentElement;
          ok(de.scrollWidth <= de.clientWidth, "scrollWidth " + de.scrollWidth);
          for (const el of p.qa("#settings, #settings *")) {
            const q = p.rect(el);
            if (q.width === 0) continue;
            ok(q.left >= -0.5 && q.right <= 360.5, el.tagName + "#" + el.id + " spans " + q.left + ".." + q.right);
          }
        });
      }
    });

    await test("Check now: the time of a manual check is recorded, so the next start does not check again", () => withPage({}, null, async (p) => {
      localStorage.removeItem(LAST);
      await p.openSettings();
      await p.click(p.$("upd_check"));
      ok(Math.abs(Number(localStorage.getItem(LAST)) - Date.now()) < 60000, "time recorded");
    }));  }

  run().then(() => {
    document.getElementById("result").textContent = failures === 0 ? "ALL PASS" : "FAIL " + failures;
    document.title = "settings tests: " + total + " cases";
    const n = document.createElement("li");
    n.textContent = "cases: " + total + ", failed: " + failures;
    log.appendChild(n);
  }, (e) => {
    failures++;
    const li = document.createElement("li");
    li.className = "fail";
    li.textContent = "HARNESS ERROR " + (e && e.stack ? e.stack : e);
    log.appendChild(li);
    document.getElementById("result").textContent = "FAIL " + failures;
  });
})();
</script>
</body>
</html>
